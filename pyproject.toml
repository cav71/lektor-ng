[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lektor-ng"
version = "0.0.2"
description = "A fork of a static content management system (Lektor)."
readme = "README.md"

authors = [
    { name = "A. Cavallo", email = "a.cavallo@cavallinux.eu" },
]

license = "BSD-3-Clause"

license-files = [
    "licenses/LICENSE",
    "licenses/LICENSE.new",
]

urls.Homepage = "https://github.com/cav71/lektor-ng"
urls.Source = "https://github.com/cav71/lektor-ng"

classifiers = [
    "Framework :: Lektor",
    "Development Status :: 1 - Planning",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

requires-python = ">=3.11"

dependencies = [
    "build",
    "Babel",
    "click>=6.0",
    "Flask",
    "Jinja2>=3.0",
    "MarkupSafe",
    "marshmallow",
    "marshmallow_dataclass>=8.5.9",
    "mistune>=0.7.0,<3,!=2.0.*",
    "Pillow>=6",
    "pip",
    "python-slugify",
    "requests",
    "sqlalchemy",
    "tzdata; sys_platform == 'win32'",
    "watchfiles>=0.12",
    "Werkzeug>=2.1.0",
]
optional-dependencies.ipython = [
    "ipython",
    "traitlets",
]

[project.scripts]
lektor-ng = "lektor_ng.cli.cli_old:main"
lektor-build = "lektor_ng.cli.build:main"

[dependency-groups]
dev = [                         # generally useful during development
    "coverage[toml]",
    "hatchling",
    "iniconfig",
    "iniconfig",
    "pre-commit",
    "pylint==4.0.4",
    "pytest-click",
    "pytest-cov",
    "pytest-html",
    "pytest-mock",
    "pytest>=6",
    "pre-commit",
    "ruff",
    "mypy",
]

[tool.hatch.build]
artifacts = [
    "/lektor/admin/static",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
exclude = [
    "src/lektor_ng/cli/build.py",
    "src/lektor_ng/datamodel.py",
    "src/lektor_ng/db.py",
    "src/lektor_ng/devserver.py",
    "src/lektor_ng/editor.py",
    "src/lektor_ng/environment/*",
    "src/lektor_ng/imagetools/*",
    "src/lektor_ng/publisher.py",
    "src/lektor_ng/quickstart.py",
    "src/lektor_ng/types/base.py",
    "src/lektor_ng/types/multi.py",
    "src/lektor_ng/types/primitives.py",
    "src/lektor_ng/admin/modules/api.py",
    "src/lektor_ng/markdown/controller.py",
    "src/lektor_ng/markdown/controller.py",
    "src/lektor_ng/markdown/mistune2.py",
    "src/lektor_ng/metaformat.py",
    "src/lektor_ng/reporter.py",
    "src/lektor_ng/utils.py",
    "tests/admin/test_serve.py",
    "tests/admin/test_webui.py",
    "tests/imagetools/test_exif.py",
    "tests/imagetools/test_exif.py",
    "tests/test_buildfailures.py",
    "tests/test_editor.py",
    "tests/test_environment.py",
    "tests/test_pluginsystem.py",
    "tests/test_publisher.py",
    "tests/test_urls.py",
]

[tool.pytest.ini_options]
markers = [
    "requiresinternet: use internet connection.",
    "slowtest: slow tests.",
    "toremove: test to refactor out.",
]
