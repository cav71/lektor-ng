name: Release-build

on:
  push:
    tags:
      - v*

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  PACKAGE: ${{ github.event.repository.name }}
  PYTHONPATH: src
  # GITHUB_DUMP: ${{ toJson(github) }}
  GITHUB_DUMP: |
    {
      "event": {
        "repository": {
          "name": "${{ github.event.repository.name }}",
          "default_branch": "${{ github.event.repository.default_branch }}",
          "html_url": "${{ github.event.repository.html_url }}"
        }
      },
      "ref": "${{ github.ref }}",
      "sha": "${{ github.sha }}",
      "run_number": "${{ github.run_number }}",
      "ref_name": "${{ github.ref_name }}"
    }
  TARGETPY: "3.14"
  TARGETOS: "ubuntu-latest"


jobs:
  tags:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.14"]
    runs-on: ${{ matrix.os }}

    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # WARNING!! this is important
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Dump ENV
        shell: bash
        run: |
          echo "=== GITHUB_DUMP ==="
          echo "$GITHUB_DUMP" | python -m json.tool 
          echo "=== END GITHUB_DUMP ==="

      # https://github.com/actions/setup-python
      - name: Setup Python toolchain for ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run builder --dump
        shell: bash
        run: |
          python support/builder.py --dump beta
          python support/builder.py --dump release
          python support/builder.py --dump post
