name: Beta-build

on:
  push:
    branches:
      - beta/*

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  PACKAGE: ${{ github.event.repository.name }}
  PYTHONPATH: src
  # GITHUB_DUMP: ${{ toJson(github) }}
  GITHUB_DUMP: |
    {
      "event": {
        "repository": {
          "name": "${{ github.event.repository.name }}",
          "default_branch": "${{ github.event.repository.default_branch }}",
          "html_url": "${{ github.event.repository.html_url }}"
        }
      },
      "ref": "${{ github.ref }}",
      "sha": "${{ github.sha }}",
      "run_number": "${{ github.run_number }}",
      "ref_name": "${{ github.ref_name }}"
    }
  TARGETPY: "3.14"
  TARGETOS: "ubuntu-latest"


jobs:
  betas:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}

    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # WARNING!! this is important
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      # - name: Dump ENV
      #   shell: bash
      #   run: |
      #     echo "=== GITHUB_DUMP ==="
      #     echo "$GITHUB_DUMP" | python -m json.tool 
      #     echo "=== END GITHUB_DUMP ==="

      # https://github.com/actions/setup-python
      - name: Setup Python toolchain for ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # https://github.com/astral-sh/setup-uv
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Python dependencies
        shell: bash
        run: |
          uv sync --no-managed-python

      - name: Run Python checks (tests)
        shell: bash
        env:
          OUTDIR: build/qa-${{ matrix.python-version }}-${{ matrix.os}}
        run: |
          mkdir -p ${OUTDIR}
          echo "$GITHUB_DUMP" > ${OUTDIR}/github.json
          uv run pytest -vvs -l \
              --cov=${{ env.PACKAGE }} \
              --cov-report=html:$OUTDIR/coverage --cov-report=xml:$OUTDIR/coverage.xml \
              --junitxml=$OUTDIR/junit/junit.xml --html=$OUTDIR/junit/junit.html --self-contained-html \
            tests

      - name: Packaging
        if: ${{ (matrix.python-version == env.TARGETPY) && (matrix.os == env.TARGETOS) }}
        shell: bash
        env:
          OUTDIR: build/qa-${{ matrix.python-version }}-${{ matrix.os}}
        run: |
            uv run ./support/builder.py beta
            mkdir -p $OUTDIR && cp dist/*.whl $OUTDIR

      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: qa-results-${{ matrix.python-version }}-${{ matrix.os }}
          path: |
            build/qa-${{ matrix.python-version }}-${{ matrix.os}}
        # Use always() to always run this step to publish test results when there are test failures
        if: always()

  pypi-publish:
    name: upload release to PyPI
    runs-on: ubuntu-latest
    # Specifying a GitHub environment is optional, but strongly encouraged
    environment: pypi
    permissions:
      # IMPORTANT: this permission is mandatory for Trusted Publishing
      id-token: write
    steps:
      # retrieve your distributions here
  
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
